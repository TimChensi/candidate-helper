name: Diagnostic Apps Script
on:
  push:
    paths:
      - ".github/workflows/diagnostic-apps-script.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: GET endpoint
        run: |
          curl -sS -i -L --max-time 30 "https://script.google.com/macros/s/AKfycbyqD9x1tez2GgD_2tkNDDJyX4wZ331tNFbsU22yyS6hAtlAAFztFa2T4gaFAPIHObR1yw/exec"
      - name: POST diagnostic candidate
        run: |
          curl -sS -i -L --max-time 30 \
            -H "Content-Type: text/plain;charset=utf-8" \
            --data '{"candidateOwner":"Тимофей","phone":"70000000001","contactStatus":"НДЗ 1","fullName":"DIAGNOSTIC TEST","age":"","residenceCity":"","registrationCity":"","processingCity":"","citizenship":"","militaryCategory":"","healthLimits":"","disability":"","criminalRecord":"","driverLicense":"","directionWish":"","departureReadiness":"","agreementText":"Согласование кандидата\\n1. Чей кандидат: Тимофей\\n2. Телефон: 70000000001\\n3. Статус контакта: НДЗ 1"}' \
            "https://script.google.com/macros/s/AKfycbyqD9x1tez2GgD_2tkNDDJyX4wZ331tNFbsU22yyS6hAtlAAFztFa2T4gaFAPIHObR1yw/exec"
